name: Build Blinds OS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BlindsOS-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "BlindsOS-$VER.apk"
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" "BlindsOS-$VER.apk" \
            --title "Blinds OS $VER" \
            --notes "Blinds OS $VER. Download the APK and install it over your current version. Your settings are kept." \
            --target "$GITHUB_SHA" \
            --latest
